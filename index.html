<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل موقع سندكم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<script src="https://unpkg.com/lucide@0.263.1/dist/umd/lucide.min.js"></script>
<style>
/* Layout: one-screen tour app — top bar, right sidebar of site pages + steps, stage = browser mock of the live page with spotlight + popover pointer */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --sunk:#F3F7F8; --ink:#12303A; --muted:#5A6E78; --line:#D7E1E5;
  --deep:#17505E; --blue:#3380C4; --teal:#14A88F; --teal-soft:#DFF4EF; --blue-soft:#E3EEF8; --gold:#C79A3A; --gold-soft:#F6EEDC;
  --dim:rgba(9,30,38,.55); --site-bg:#FFFFFF; --site-alt:#F5F8F9;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(18,48,58,.06),0 10px 30px -12px rgba(18,48,58,.25);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B171C; --surface:#12232A; --sunk:#0F1E24; --ink:#E4EEF1; --muted:#97AEB7; --line:#243A42;
  --deep:#7FC9D6; --blue:#6FA9E0; --teal:#3FCDB2; --teal-soft:#123A33; --blue-soft:#14283A; --gold:#DDB35E; --gold-soft:#2C2614;
  --dim:rgba(0,0,0,.62); --site-bg:#14262D; --site-alt:#102026;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B171C; --surface:#12232A; --sunk:#0F1E24; --ink:#E4EEF1; --muted:#97AEB7; --line:#243A42;
  --deep:#7FC9D6; --blue:#6FA9E0; --teal:#3FCDB2; --teal-soft:#123A33; --blue-soft:#14283A; --gold:#DDB35E; --gold-soft:#2C2614;
  --dim:rgba(0,0,0,.62); --site-bg:#14262D; --site-alt:#102026;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;direction:rtl;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:600;color:var(--deep);line-height:1.35;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
svg.lucide{width:1.1em;height:1.1em;stroke-width:1.9;flex-shrink:0}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}

/* Top bar */
.topbar{display:flex;align-items:center;gap:14px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:44px;height:44px;border-radius:11px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex-shrink:0}
.brand .logo img{width:40px;height:auto}
.brand h1{font-size:1.05rem}
.brand small{display:block;color:var(--muted);font-size:.78rem;font-family:var(--f-body);font-weight:500}
.overall{margin-inline-start:auto;display:flex;align-items:center;gap:12px;min-width:0}
.overall .meter{width:180px;height:6px;background:var(--sunk);border-radius:9px;overflow:hidden}
.overall .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));width:0;transition:width .35s}
.overall span{font-size:.82rem;color:var(--muted);white-space:nowrap}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:9px;cursor:pointer;font-size:.86rem;white-space:nowrap}
.tbtn:hover{border-color:var(--teal)}
.tbtn.on{background:var(--deep);color:var(--bg);border-color:var(--deep)}

/* Body */
.main{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
.side,.stage{min-width:0}
.side{border-inline-end:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:14px 12px 24px;min-height:0}
.side .lbl{font-size:.75rem;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:4px 8px 8px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.pbtn{width:100%;text-align:right;display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;border:0;background:none;padding:9px 8px;border-radius:10px;cursor:pointer}
.pbtn:hover{background:var(--sunk)}
.pbtn .ic{width:32px;height:32px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.pbtn b{display:block;font-weight:600;font-size:.93rem}
.pbtn small{display:block;color:var(--muted);font-size:.75rem;line-height:1.4}
.pbtn .st{font-size:.72rem;color:var(--muted);display:inline-flex;align-items:center}
.pbtn .st.done{color:var(--teal)}
.pitem.cur .pbtn{background:var(--teal-soft)}
.pitem.cur .pbtn .ic{background:var(--teal);color:var(--bg)}
.pitem.cur .pbtn b{color:var(--teal)}
.slist{list-style:none;margin:4px 0 8px;padding:0 0 0 0;padding-inline-start:28px;position:relative}
.slist::before{content:"";position:absolute;inset-inline-start:23px;top:6px;bottom:6px;width:2px;background:var(--line)}
.slist button{width:100%;text-align:right;border:0;background:none;padding:5px 10px;border-radius:8px;cursor:pointer;display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:center;font-size:.86rem;color:var(--muted)}
.slist button:hover{color:var(--ink)}
.slist button .d{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--surface);position:relative;z-index:1;margin-inline-start:-2px}
.slist button.seen .d{border-color:var(--teal);background:var(--teal)}
.slist button.now{color:var(--ink);font-weight:600;background:var(--sunk)}
.slist button.now .d{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}

/* Stage */
.stage{min-height:0;display:flex;flex-direction:column;padding:16px;gap:12px}
.browser{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.bbar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--sunk);border-bottom:1px solid var(--line);direction:ltr}
.bbar .dots{display:flex;gap:5px}.bbar .dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.bbar .url{flex:1;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;min-width:0}
.bbar a{font-size:.78rem;color:var(--teal);white-space:nowrap;display:inline-flex;align-items:center;gap:4px;direction:rtl}
.vp{flex:1;min-height:0;overflow:auto;position:relative;background:var(--site-bg);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){.vp{scroll-behavior:auto}}

/* Spotlight + popover */
.spot{position:absolute;z-index:40;border-radius:12px;pointer-events:none;box-shadow:0 0 0 3px var(--gold),0 0 0 9999px var(--dim);transition:top .35s ease,left .35s ease,width .35s ease,height .35s ease}
.spot .ping{position:absolute;inset-inline-start:-12px;top:-12px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1b1305;font:700 .78rem var(--f-body);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.spot .ping::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--gold);opacity:.7;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{from{transform:scale(.7);opacity:.8}to{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.spot,.pop{transition:none}.spot .ping::after{animation:none}}
.pop{position:absolute;z-index:50;width:min(340px,calc(100% - 24px));background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:0 18px 48px -12px rgba(0,0,0,.45);border:1px solid var(--line);padding:16px 16px 12px;transition:top .35s ease,left .35s ease}
.pop .arrow{position:absolute;width:14px;height:14px;background:var(--surface);border:1px solid var(--line);transform:rotate(45deg)}
.pop.below .arrow{top:-8px;border-right:0;border-bottom:0}
.pop.above .arrow{bottom:-8px;border-left:0;border-top:0}
.pop .ptop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pop .tag{font-size:.74rem;font-weight:600;color:var(--teal);background:var(--teal-soft);padding:2px 9px;border-radius:999px}
.pop .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;display:grid;place-items:center}
.pop h3{font-size:1.05rem;margin-top:8px}
.pop p{color:var(--muted);font-size:.92rem;margin-top:4px}
.pop .kind{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:.8rem;color:var(--gold);font-weight:600}
.pop .pfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.dotsrow{display:flex;gap:4px}
.dotsrow i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.dotsrow i.on{background:var(--teal);width:16px;border-radius:4px}
.pbtns{display:flex;gap:6px}
.pbtns button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-size:.86rem}
.pbtns button.pri{background:var(--deep);border-color:var(--deep);color:var(--bg);font-weight:600}
.pbtns button:disabled{opacity:.4;cursor:default}

.hint{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.8rem;flex-wrap:wrap}
.hnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hnav button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:6px 12px;cursor:pointer;font-size:.84rem}
.hnav button.pri{background:var(--teal);border-color:var(--teal);color:var(--bg);font-weight:600}
.hnav button:disabled{opacity:.4;cursor:default}
.hint kbd{font-family:var(--f-body);background:var(--surface);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:.75rem}

/* ===== Site mock ===== */
.site{color:var(--ink);font-size:14px;min-height:100%;display:flex;flex-direction:column}
.s-nav{display:flex;align-items:center;gap:6px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--site-bg);flex-wrap:wrap}
.s-brand{display:flex;align-items:center;gap:8px;margin-inline-end:auto}
.s-brand .lg{width:34px;height:34px;border-radius:8px;background:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.s-brand .lg img{width:31px}
.s-brand b{font-size:.86rem;color:var(--deep);line-height:1.3}
.s-brand small{display:block;font-size:.6rem;color:var(--muted);letter-spacing:.02em;direction:ltr;text-align:right}
.s-menu{display:flex;gap:2px;flex-wrap:wrap}
.s-menu span{padding:5px 9px;border-radius:7px;font-size:.84rem;color:var(--ink)}
.s-menu span.cur{color:var(--teal);font-weight:700;background:var(--teal-soft)}
.s-portal{background:var(--teal);color:var(--bg);padding:6px 12px;border-radius:8px;font-weight:600;font-size:.82rem}
.s-body{padding:26px 22px;display:flex;flex-direction:column;gap:22px;flex:1}
.s-eyebrow{font-size:.78rem;color:var(--gold);font-weight:700}
.s-h1{font-family:var(--f-display);font-size:1.7rem;color:var(--deep);font-weight:700;line-height:1.35}
.s-h2{font-family:var(--f-display);font-size:1.15rem;color:var(--deep);font-weight:600}
.s-lead{color:var(--muted);max-width:60ch}
.s-row{display:flex;gap:8px;flex-wrap:wrap}
.s-btn{background:var(--deep);color:var(--bg);padding:7px 14px;border-radius:9px;font-weight:600;font-size:.84rem;display:inline-flex;align-items:center;gap:6px}
.s-btn.ghost{background:none;color:var(--deep);border:1.5px solid var(--deep)}
.s-btn.gold{background:var(--gold);color:#1b1305}
.s-grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.s-card{background:var(--site-alt);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.s-card b{color:var(--deep)}
.s-card small{color:var(--muted);font-size:.82rem;line-height:1.55}
.s-card .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal)}
.s-stat b{font-family:var(--f-display);font-size:1.6rem;color:var(--deep);display:block;line-height:1.2}
.s-art{border-radius:12px;background:radial-gradient(circle at 25% 40%,var(--blue-soft),transparent 60%),radial-gradient(circle at 75% 60%,var(--teal-soft),transparent 55%),var(--site-alt);display:grid;place-items:center;color:var(--muted);font-size:.78rem;min-height:120px;text-align:center;padding:10px}
.s-hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
.s-hero>div{min-width:0}
.s-warn{background:var(--gold-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.84rem;display:flex;gap:8px;align-items:flex-start}
.s-warn svg{color:var(--gold);margin-top:3px}
.s-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.s-list li{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:.88rem}
.s-list li svg{color:var(--teal);margin-top:4px}
.s-steps{counter-reset:k;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.s-steps li{counter-increment:k;display:grid;grid-template-columns:28px 1fr;gap:10px;font-size:.88rem}
.s-steps li::before{content:counter(k);width:26px;height:26px;border-radius:50%;background:var(--deep);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.s-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.s-tabs span{padding:8px 12px;font-size:.86rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.s-tabs span.cur{color:var(--teal);border-color:var(--teal);font-weight:700}
.s-bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.s-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal))}
.s-figs{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.s-chip{font-size:.75rem;background:var(--blue-soft);color:var(--blue);padding:2px 9px;border-radius:999px;font-weight:600}
.s-acc{border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--deep);font-size:.9rem;background:var(--site-bg)}
.s-acc.open{flex-direction:column;align-items:flex-start;gap:4px}
.s-acc.open small{font-weight:400;color:var(--muted)}
.s-docs{display:flex;flex-direction:column;gap:6px}
.s-doc{display:flex;align-items:center;gap:8px;font-size:.86rem;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--site-bg)}
.s-doc svg{color:var(--blue)}
.s-sec{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:9px;background:var(--site-alt);font-size:.87rem}
.s-sec b{color:var(--deep)}
.s-jump{display:flex;gap:6px;flex-wrap:wrap}
.s-jump span{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.s-login{max-width:380px;margin:20px auto;background:var(--site-alt);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center}
.s-field{width:100%;height:36px;border:1px solid var(--line);border-radius:9px;background:var(--site-bg)}
.s-foot{background:var(--deep);color:var(--bg);padding:18px 22px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px;font-size:.8rem}
.s-foot b{display:block;margin-bottom:4px}
.s-foot span{display:block;opacity:.85}

@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:minmax(0,1fr)}
  .topbar{flex-wrap:wrap}
  .overall{margin-inline-start:0;width:100%;justify-content:space-between}
  .overall .meter{flex:1}
  .tbtn span{display:none}
  .side{border-inline-end:0;border-bottom:1px solid var(--line);padding:8px 10px;overflow-x:auto;overflow-y:hidden}
  .side .lbl,.slist{display:none}
  .plist{flex-direction:row;gap:4px}
  .pbtn{grid-template-columns:26px auto;white-space:nowrap;padding:6px 8px}
  .pbtn .ic{width:26px;height:26px}
  .pbtn small,.pbtn .st{display:none}
  .stage{padding:10px}
  .browser{height:76vh;flex:none}
  .overall .meter{width:90px}
  .brand small{display:none}
  .s-hero,.g3,.g4,.s-foot{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  .s-body{padding:18px 14px}
  .s-nav{padding:10px 14px}
  .s-menu{display:none}
}
</style>

</head>
<body>

{id:'about',ic:'info',title:'عن سندكم',sub:'الهوية والرؤية',path:'/about',menu:'عن سندكم',
 html:()=>nav('عن سندكم')+'<div class="s-body">'+
  '<div data-s="intro"><div class="s-h1">السند الآمن للأيتام المحتضنين وأسرهم</div><p class="s-lead" style="margin-top:8px">جمعية أهلية مقرها محافظة جدة، تأسست في 15 نوفمبر 2023، ومسجلة لدى المركز الوطني لتنمية القطاع غير الربحي بترخيص رقم 5510، وتعمل في منطقة مكة المكرمة.</p></div>'+
  '<div class="s-grid g2" data-s="vision"><div class="s-card"><b>رؤيتنا</b><small>السند الآمن للأيتام المحتضنين وأسرهم الحاضنة.</small></div><div class="s-card"><b>رسالتنا</b><small>تقديم خدمات متكاملة لتمكين الأيتام المحتضنين ومساندة أسرهم الحاضنة، وفق إطار مؤسسي وشراكات متنوعة.</small></div></div>'+
  '<div data-s="journey"><div class="s-h2">كيف نبني رحلة المساندة؟</div><div class="s-grid g3" style="margin-top:10px">'+card('search','نفهم الاحتياج','دراسة احتياج الأسرة والطفل وأولوياتهما')+card('hand-heart','نساند ونمكّن','ربط الاحتياج بالخدمة المناسبة')+card('line-chart','نتابع ونقيس','توثيق النتائج والتمييز بين المستهدف والمتحقق')+'</div></div>'+
  '<div class="s-warn" data-s="dignity">'+I('shield-check')+'<span>نحفظ كرامة الطفل والأسرة وخصوصيتهما. لا تتطلب المشاركة في العطاء كشف هويات المستفيدين أو نشر تفاصيل حياتهم.</span></div>'+
  '<div><span class="s-btn ghost" data-s="govbtn">اطلع على الحوكمة والوثائق</span></div></div>'+foot,
 steps:[
  ['intro','الهوية النظامية','تاريخ التأسيس والمقر ورقم الترخيص الوطني، وهي أول ما تبحث عنه الجهات المانحة للتحقق من الجمعية.'],
  ['vision','الرؤية والرسالة','الاتجاه الاستراتيجي للجمعية بصياغة مختصرة.'],
  ['journey','رحلة المساندة','منهج العمل في ثلاث مراحل: فهم الاحتياج، ثم المساندة والتمكين، ثم المتابعة والقياس.'],

/* flatten */
const FLAT=[];P.forEach((p,pi)=>p.steps.forEach((s,si)=>FLAT.push({pi,si})));
let idx=0,curPage=-1,showSpot=true;const seen=new Set([0]);
const $=id=>document.getElementById(id);
const vp=$('vp'),site=$('site'),spot=$('spot'),pop=$('pop');
const draw=()=>{try{window.lucide&&lucide.createIcons()}catch(e){}};

/* sidebar */
const plist=$('plist');
P.forEach((p,pi)=>{const li=document.createElement('li');li.className='pitem';li.dataset.pi=pi;
  li.innerHTML='<button type="button" class="pbtn"><span class="ic">'+I(p.ic)+'</span><span><b>'+p.title+'</b><small>'+p.sub+'</small></span><span class="st num"></span></button><ul class="slist" hidden>'+p.steps.map((s,si)=>'<li><button type="button" data-pi="'+pi+'" data-si="'+si+'"><span class="d"></span><span>'+s[1]+'</span></button></li>').join('')+'</ul>';
  li.querySelector('.pbtn').addEventListener('click',()=>go(FLAT.findIndex(f=>f.pi===pi)));
  li.querySelectorAll('.slist button').forEach(b=>b.addEventListener('click',()=>go(FLAT.findIndex(f=>f.pi==b.dataset.pi&&f.si==b.dataset.si))));
  plist.appendChild(li);});

function renderSidebar(){const {pi,si}=FLAT[idx];
  plist.querySelectorAll('.pitem').forEach(li=>{const p=+li.dataset.pi,isCur=p===pi;li.classList.toggle('cur',isCur);li.querySelector('.slist').hidden=!isCur;
    const st=li.querySelector('.st');const tot=P[p].steps.length;let n=0;FLAT.forEach((f,i)=>{if(f.pi===p&&seen.has(i))n++});
    st.className='st num'+(n===tot?' done':'');st.innerHTML=n===tot?I('check-circle-2'):n+'/'+tot;
    li.querySelectorAll('.slist button').forEach(b=>{const fi=FLAT.findIndex(f=>f.pi==b.dataset.pi&&f.si==b.dataset.si);b.classList.toggle('seen',seen.has(fi));b.classList.toggle('now',fi===idx)});
    if(isCur&&matchMedia('(max-width:860px)').matches){const s=li.parentElement.parentElement;s.scrollTo({left:li.offsetLeft-s.clientWidth/2+li.offsetWidth/2,behavior:'smooth'})}});
  $('meter').style.width=(seen.size/FLAT.length*100)+'%';
  $('overallTxt').textContent='الخطوة '+(idx+1)+' من '+FLAT.length;}

function loadPage(pi){if(pi===curPage)return;curPage=pi;const p=P[pi];
  site.innerHTML='<div class="site">'+p.html()+'</div>';
  $('url').textContent=p.ext?p.path:'sanadcom.org.sa'+(p.path==='/'?'':p.path);
  $('openLink').href=p.ext||B+p.path;vp.scrollTop=0;draw();}

function go(i){if(i<0||i>=FLAT.length)return;idx=i;seen.add(i);const {pi,si}=FLAT[i];loadPage(pi);renderSidebar();renderPop();place(true);}

function renderPop(){const {pi,si}=FLAT[idx],p=P[pi],s=p.steps[si];
  $('popTag').textContent=p.title+' · '+(si+1)+'/'+p.steps.length;$('popTitle').textContent=s[1];$('popText').textContent=s[2];
  const k=$('popKind');if(s[3]){k.hidden=false;k.querySelector('span').textContent=s[3]}else k.hidden=true;
  $('popDots').innerHTML=p.steps.map((_,j)=>'<i class="'+(j===si?'on':'')+'"></i>').join('');
  $('ping').textContent=si+1;
  $('prevBtn').disabled=idx===0;$('hPrev').disabled=idx===0;
  const last=idx===FLAT.length-1;$('nextBtn').innerHTML=last?'إنهاء الجولة'+I('check'):(si===p.steps.length-1?'الصفحة التالية':'التالي')+I('arrow-left');draw();}

function place(scroll){const {pi,si}=FLAT[idx];const el=site.querySelector('[data-s="'+P[pi].steps[si][0]+'"]');
  spot.hidden=pop.hidden=!showSpot||!el;if(!el||!showSpot)return;
  const v=vp.getBoundingClientRect();let r=el.getBoundingClientRect();
  let top=r.top-v.top+vp.scrollTop,left=r.left-v.left+vp.scrollLeft;
  if(scroll){const want=Math.max(0,top-Math.min(90,vp.clientHeight*.15));vp.style.scrollBehavior='auto';vp.scrollTop=want;vp.style.scrollBehavior='';}
  const pad=6;spot.style.top=(top-pad)+'px';spot.style.left=(left-pad)+'px';spot.style.width=(r.width+pad*2)+'px';spot.style.height=(r.height+pad*2)+'px';
  const pw=pop.offsetWidth,ph=pop.offsetHeight,vw=vp.clientWidth,st=vp.scrollTop,vh=vp.clientHeight;
  let pt=top+r.height+pad+14,below=true;
  if(pt+ph>st+vh-8 && top-pad-14-ph>=st+8){pt=top-pad-14-ph;below=false}
  pt=Math.min(Math.max(pt,st+8),st+vh-ph-8);
  let cx=left+r.width/2;let pl=Math.min(Math.max(cx-pw/2,12),vw-pw-12);
  pop.style.top=pt+'px';pop.style.left=pl+'px';pop.classList.toggle('below',below);pop.classList.toggle('above',!below);
  const ax=Math.min(Math.max(cx-pl-7,16),pw-30);$('arrow').style.left=ax+'px';
  const overlaps=below?pt<top+r.height:pt+ph>top;$('arrow').style.display=overlaps?'none':'block';}

$('nextBtn').addEventListener('click',()=>{if(idx===FLAT.length-1){go(0);return}go(idx+1)});
$('prevBtn').addEventListener('click',()=>go(idx-1));
$('hPrev').addEventListener('click',()=>go(idx-1));
$('hNext').addEventListener('click',()=>{if(idx===FLAT.length-1){go(0);return}go(idx+1)});
const app=document.querySelector('.app');app.setAttribute('tabindex','-1');app.style.outline='none';
const grab=()=>{try{window.focus();if(!document.activeElement||document.activeElement===document.body)app.focus({preventScroll:true})}catch(e){}};
document.addEventListener('pointerdown',()=>setTimeout(grab,0),true);grab();
function setSpot(on){showSpot=on;$('toggleSpot').classList.toggle('on',!on);$('toggleSpot').querySelector('span').textContent=on?'إخفاء المؤشر':'إظهار المؤشر';place(on)}
$('toggleSpot').addEventListener('click',()=>setSpot(!showSpot));
$('popClose').addEventListener('click',()=>setSpot(false));
$('restart').addEventListener('click',()=>{seen.clear();setSpot(true);go(0)});
window.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;
  const k=e.key;if(k==='ArrowLeft'||k==='ArrowDown'||k==='PageDown'){e.preventDefault();go(idx+1)}else if(k==='ArrowRight'||k==='ArrowUp'||k==='PageUp'){e.preventDefault();go(idx-1)}else if(k==='Escape'){setSpot(false)}},true);
addEventListener('resize',()=>place(false));
if('ResizeObserver' in window)new ResizeObserver(()=>place(false)).observe(vp);
document.fonts&&document.fonts.ready.then(()=>place(false));

draw();go(0);
})();
</script>
